# program.toml — the single source of truth for the research hub page.
#
# To change the page: edit this file, run `python build.py`, then commit
# program.toml together with the regenerated index.html.
# Needs Python 3.11 or newer; nothing else to install.
#
# Papers are listed in order. `status` is "current", "in-progress" or "archived".
# Set `show = false` on a paper to keep it off the page without deleting its entry.
# Optional per paper: `extra_links = [{ label = "…", path = "lecture/" }]` adds links to the paper's card;
# `path` is appended to the paper's Pages address.

[site]
url = "https://inha20.github.io/Research-Portfolio/"
repo = "https://github.com/inha20/Research-Portfolio"
title = "Structure Recognition Research Program"
brand = "Structure Recognition"
description = "Independent research program by Jonghun Choi (최종훈) on how humans discover structure, give it meaning and turn it into research questions. Current work: Papers 7 and 8."
keywords = [
  "structure recognition", "Karnaugh map", "Boolean function", "visual pattern analysis",
  "human-AI collaboration", "research generation", "concept evolution",
  "symmetric Boolean function", "variable rearrangement", "explanatory significance",
  "SRT", "Post's lattice",
]

[person]
name_en = "Jonghun Choi"
name_ko = "최종훈"
role_en = "Independent researcher · 2nd-year student at Inha Technical College"
role_ko = "독립 연구자 · 인하공업전문대학 2학년 재학"
email = "cjh3cjh@naver.com"
github = "https://github.com/inha20"
github_user = "inha20"
bio = "Independent researcher and second-year student at Inha Technical College. The work sits between Boolean structure analysis, cognition and long-term human-AI collaboration. Author of Structure Recognition Theory (SRT) and the Human-AI Research Continuity Theory (HARCT)."
method = "The program is AI-assisted. Humans notice structure and pose the questions; AI connects concepts and widens the space of explanations. That division of labor is itself under study (Papers 5 and 8)."
interests = [
  "Structure recognition", "Boolean functions", "Karnaugh maps", "Human cognition",
  "Human-AI collaboration", "AI in education", "Generative AI",
]

[program]
question = "How do humans come to see something new?"
lead = "A long-term, AI-assisted research program on how people discover structure, give it meaning and turn it into research questions. It starts from patterns on Karnaugh maps and grows into a theory of structure recognition and a study of human-AI research collaboration."
current_intro = "Two standalone papers. Each one can be read without the earlier ones."
map_intro = "Observations led to a theory, the theory to a study of the collaboration that produced it, and the mathematics to a standalone classification. Papers 1–6 are archived; Papers 7 and 8 carry the work forward."
archive_note = "Early research notes, read-only since 2026-10-18. Their content was consolidated and corrected in Papers 7 and 8, so please cite those instead."
threads = "Exploratory threads without a paper yet: AI collaboration education · structure-based elementary mathematics."

# ---------------------------------------------------------------- layers
# Used for the program map. `papers` refers to paper ids below.

[[layers]]
id = "empirical"
label = "Layer 1 · Empirical foundation"
title = "Case studies"
desc = "Concrete observations from Boolean symmetries and visual Karnaugh mappings."
papers = [1, 2, 3]

[[layers]]
id = "theory"
label = "Layer 2 · Theoretical integration"
title = "Structure Recognition Theory"
desc = "An exploratory cognitive framework with ten hypotheses (H1–H10). The hypotheses are not yet empirically tested."
papers = [4]

[[layers]]
id = "method"
label = "Layer 3 · Methodological meta-layer"
title = "Human-AI collaboration"
desc = "How research stays continuous across long, multi-session work with AI."
papers = [5]

[[layers]]
id = "extension"
label = "Layer 4 · Mathematical extension"
title = "Boolean function spaces"
desc = "Orbit classification of gate-generated function spaces."
papers = [6]

[[layers]]
id = "synthesis"
label = "Synthesis · Standalone papers"
title = "Current papers"
desc = "Group-theoretic mathematics (Track A) and structural thinking with human-AI research (Track B)."
papers = [7, 8]

