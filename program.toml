# ---------------------------------------------------------------- genealogy
# The actual order in which the ideas appeared, not a logical reconstruction.

[[genealogy]]
title = "Pattern"
note = "First observation: alternating checkerboard patterns for XOR/XNOR on Karnaugh maps."

[[genealogy]]
title = "Layer structure"
note = "Hamming-weight layers govern where the patterns of symmetric functions sit."

[[genealogy]]
title = "Equivalence and structural invariance"
note = "Observation: variable rearrangements preserve structural features of the picture across map re-orderings."

[[genealogy]]
title = "Structure Recognition Theory"
note = "The meta-question: why do some structures trigger research inquiry while others go unnoticed?"

[[genealogy]]
title = "Human-AI collaboration model"
note = "Division of cognitive labor: humans discover structure intuitively; AI systematically widens the space of explanations."

[[genealogy]]
title = "Boolean function space theory (archived)"
note = "A former mathematical frontier, now superseded by Paper 7: gate-generated subspaces and Post's lattice."

[[genealogy]]
title = "Standalone Papers 7 and 8 (current)"
note = "Group-theoretic classification of 4-variable Boolean function spaces (7) and structural thinking with human-AI research collaboration (8). Each can be read without the earlier papers."

